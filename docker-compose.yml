version: "3.9"

services:
  # ---------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: kafka_tutorials_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - app/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/kafka_tutorials
      - REDIS_URL=redis://redis:6379
      - KAFKA_CLIENT_ID=kafka_tutorials_app
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongo
      - redis
      - kafka
    networks:
      - app_network

  # ---------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: kafka_tutorials_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=kafka_tutorials
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  # ---------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kafka_tutorials_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispassword}
      --appendonly yes
      --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # ---------------------------------------------------------------
  # Kafka (single-broker, KRaft mode — no Zookeeper)
  # ---------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka_tutorials_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - app_network

  # ---------------------------------------------------------------
  # Kafka UI (optional — manage/inspect topics)
  # ---------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_tutorials_kafka_ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - app_network

volumes:
  mongo_data:
  redis_data:
  kafka_data:

networks:
  app_network:
    driver: bridge